[project]
name = "cnc-asset-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.2",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
cnc-asset-api = "cnc_asset_api.cli:run"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cnc_asset_api --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle: errors
    "F",    # pyflakes: imports and unused variables
    "I",    # isort: import order
    "B",    # bugbear: common pitfalls
    "UP",   # pyupgrade: modern Python syntax
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
